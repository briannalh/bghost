<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>B Ghost</title>

  <meta name="description" content="B Ghost">

  <meta property="og:title" content="B Ghost">
  <meta property="og:description" content="Official Artist Site">
  <meta property="og:image" content="/assets/og-image.jpg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bghosting.co">

  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="256x256" href="/assets/favicon-256x256.png">

  <link rel="stylesheet" href="style.css">
</head>

<body class="fade-in">

  <a class="site-logo" href="/">
    <img src="assets/initials-black.svg" alt="B Ghost — Home">
  </a>

  <main class="main">

    <nav class="nav">
      <a href="https://www.instagram.com/bghostinggg/" target="_blank">Instagram</a>
      <a href="https://open.spotify.com/artist/0FOueJTXsoIjUxvJPQTPKQ" target="_blank">Spotify</a>
      <a href="https://www.youtube.com/@BGhost" target="_blank">Youtube</a>
      <a href="/tour">Tour</a>
      <a href="/epk">EPK</a>
    </nav>

    <section class="hero">
      <div class="hero-image-wrap">
        <video class="hero-image" src="assets/B Ghost.mov" autoplay muted loop playsinline></video>
        <h1>B Ghost</h1>
        <img class="hero-initials" src="assets/initials.svg" alt="">
      </div>
    </section>

    <footer class="footer">
      <p class="caption">Management</p>

      <a href="https://www.portminority.com/" target="_blank">
        <img class="pmtm" src="assets/PMTM.svg" alt="PMTM">
      </a>

      <a class="caption caption-link" href="mailto:talent@portminority.com">Contact</a>
    </footer>

    <aside class="release-card">
      <img class="release-image" src="assets/ep.png" alt="Demos I Shouldn't Release">

      <div class="release-copy">
        <p class="caption">Now available:</p>

        <a class="caption caption-link"
          href="https://open.spotify.com/album/4x68vPAEzHIvwDsnR9qyl1"
          target="_blank">
          “Demos I Shouldn’t Release”
        </a>
      </div>
    </aside>

  </main>

  <script>
    // Pull editable content from Sanity. The HTML above holds the defaults,
    // so the page renders fine even if the fetch fails or no doc is published.
    (function () {
      const PROJECT_ID = "tabkldbj";
      const DATASET = "production";
      const API_VERSION = "2023-10-01";

      const groq = encodeURIComponent(
        '*[_id == "homepage"][0]{' +
          "heroTitle, socialLinks, footer, release," +
          '"releaseImageUrl": release.image.asset->url,' +
          '"heroVideoUrl": heroVideo.asset->url,' +
          '"heroImageUrl": heroImage.asset->url' +
          "}"
      );

      const url =
        "https://" + PROJECT_ID + ".apicdn.sanity.io/v" + API_VERSION +
        "/data/query/" + DATASET + "?query=" + groq;

      const setText = (el, val) => { if (el && val) el.textContent = val; };
      const setHref = (el, val) => { if (el && val) el.href = val; };

      fetch(url)
        .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
        .then(({ result: d }) => {
          if (!d) return;

          setText(document.querySelector(".hero h1"), d.heroTitle);

          // Swap hero media: video takes priority, then image
          const heroMedia = document.querySelector(".hero-image");
          if (heroMedia) {
            if (d.heroVideoUrl) {
              if (heroMedia.tagName === "VIDEO") {
                heroMedia.src = d.heroVideoUrl;
              } else {
                const v = document.createElement("video");
                v.className = "hero-image";
                v.src = d.heroVideoUrl;
                v.autoplay = v.muted = v.loop = v.playsInline = true;
                v.setAttribute("playsinline", "");
                heroMedia.replaceWith(v);
              }
            } else if (d.heroImageUrl) {
              const img = document.createElement("img");
              img.className = "hero-image";
              img.src = d.heroImageUrl;
              img.alt = d.heroTitle || "B Ghost";
              heroMedia.replaceWith(img);
            }
          }

          const nav = document.querySelectorAll(".nav a");
          if (d.socialLinks) {
            setHref(nav[0], d.socialLinks.instagramUrl);
            setHref(nav[1], d.socialLinks.spotifyUrl);
            setHref(nav[2], d.socialLinks.youtubeUrl);
          }

          if (d.footer) {
            setText(document.querySelector(".footer .caption"), d.footer.managementLabel);
            setHref(document.querySelector(".footer a[href^='http']"), d.footer.managementUrl);
            const contact = document.querySelector(".footer a[href^='mailto']");
            if (contact && d.footer.contactEmail) contact.href = "mailto:" + d.footer.contactEmail;
          }

          if (d.release) {
            setText(document.querySelector(".release-copy .caption"), d.release.availableLabel);
            const relLink = document.querySelector(".release-copy a");
            if (relLink && d.release.title) relLink.textContent = "“" + d.release.title + "”";
            setHref(relLink, d.release.url);
          }
          if (d.releaseImageUrl) {
            const relImg = document.querySelector(".release-image");
            if (relImg) relImg.src = d.releaseImageUrl;
          }
        })
        .catch((err) => console.error("Homepage CMS fetch failed:", err));
    })();
  </script>

</body>
</html>
